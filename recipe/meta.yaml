{% set name = "spooles" %}
{% set version = "2.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}_{{ version }}.tar.gz
  url: http://www.netlib.org/linalg/spooles/spooles.2.2.tgz
  sha256: a84559a0e987a1e423055ef4fdf3035d55b65bbe4bf915efaa1a35bef7f8c5dd
  patches:
    - patches/gcc.patch  # [unix]
    - patches/win.patch  # [win]
    - patches/osx.patch
    # Data races in the multithreaded factor and solve.  See the patch
    # headers; without these spoolesMT.a returns silently wrong results.
    - patches/0001-MT-add-acquire-release-primitives-and-order-the-work.patch
    - patches/0002-MT-order-the-frontIsDone-p_mtx-publication-in-the-so.patch
    - patches/0003-MT-make-the-solve-s-three-inter-phase-barriers-actua.patch
    - patches/0004-MT-stop-losing-updates-on-the-factor-s-entry-counter.patch
    - patches/0005-MT-give-each-solve-thread-its-own-cpus-vector.patch
    # int overflow in the I2Ohash bucket index; Debian and FreeBSD carry
    # the same fix.
    - patches/0006-I2Ohash-fix-int-overflow-in-the-bucket-index.patch

build:
  number: 1006

requirements:
  build:
    - {{ compiler('c') }}  # [unix]
    - {{ stdlib('c') }}    # [unix]
    - {{ compiler('m2w64_c') }}  # [win]
    - {{ stdlib('m2w64_c') }}    # [win]
    - rsync  # [unix]
    - make

test:
  commands:
    - test -f ${PREFIX}/lib/spoolesMT.a  # [unix]

about:
  home: http://www.netlib.org/linalg/spooles/spooles.2.2.html
  summary: 'library for solving sparse real and complex linear systems of equations'
  license: Public Domain
  license_family: Public Domain
  description: |
    SPOOLES is a library for solving sparse real and complex linear systems of equations,
    written in the C language using object oriented design.
  doc_url: http://www.netlib.org/linalg/spooles/spooles.2.2.html

extra:
  recipe-maintainers:
    - looooo
